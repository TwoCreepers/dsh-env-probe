# dsh-env-probe bundle patch: one insert over the profile root.
#
# Installed as a bundle dependency (github:nodata404/dsh-env-probe, or a local
# tarball), the dsh loader reads this file from the `dsh.bundle.patch` field in
# package.json and applies it as a patch layer. Later layers (e.g. the user's
# profile cordis.patch.yml) address this row by id, with the last write winning.
- insert:
    - id: env-probe
      name: 'dsh-env-probe'
      config:
        language: en
        order: 30
        cacheTtlHours: 168
        # /env-refresh hands its diff to the model as a `notice` context
        # message; `steer` wakes the agent to answer it, `inject` only queues
        # it for the next step, `off` keeps the result in the UI.
        notifyModel: steer
        # runtimes / tools / shells / versionArgs / execAliases are optional;
        # see README for the configurable probe tables.
